<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: jeden sloupec, 4 kroky jako mřížky dlaždic, výsledný kód dole */
:root {
  /* Levandule – záměrně jen světlý vzhled */
  --bg: #f5f3fb; --surface: #ffffff; --fg: #251f3a; --muted: #6d6588; --line: #e0dbef;
  --accent: #6a4fc9; --accent-soft: #eee9fc; --accent-fg: #ffffff;
  --code-bg: #251f3a; --code-fg: #f3efff; --warn: #a0521b; --warn-bg: #fdeede; --ok: #2b7a55;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 999px; --r-lg: 22px; --shadow: 0 6px 24px rgba(70, 50, 140, .07);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .95rem; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
section[hidden] { display: none !important; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.step { display: flex; align-items: baseline; gap: 10px; margin: 0; font-size: 20px; font-weight: 600; }
.step b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: .8rem; flex: none; }
.val { font: 800 24px/1.1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: .82rem; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.tiles.types { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
.tiles.wide { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
.tile {
  font: 600 16px var(--f-mono); font-variant-numeric: tabular-nums;
  min-height: 46px; padding: 6px 4px; border-radius: var(--r); cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile:disabled { opacity: .3; cursor: not-allowed; }
.tile.more { background: var(--accent-soft); border-style: dashed; border-color: var(--accent); color: var(--accent); letter-spacing: .1em; }
.tile.type { font-family: var(--f-body); font-size: .95rem; text-align: left; padding: 8px 12px; display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; border-radius: 16px; padding-top: 10px; }
.tile.type small { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; opacity: .75; font-weight: 500; }
.signs { display: flex; gap: 6px; }
.signs .tile { width: 64px; font-size: 1.3rem; }
.sphrow { display: flex; gap: 16px; align-items: stretch; }
.sphleft { display: flex; flex-direction: column; gap: 8px; flex: none; width: 190px; }
.sphright { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.signs .tile { width: 84px; }
.decgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.decgrid .more { grid-column: 1 / -1; }
.divider { width: 4px; border-radius: 2px; background: var(--accent); opacity: .6; flex: none; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-top: 4px; }
.summary { margin: 4px 2px 0; font-size: 1.25rem; line-height: 1.45; }
.summary strong, .summary .m { color: var(--accent); font-weight: 600; }
.summary .m { white-space: nowrap; }
@media (max-width: 520px) { .sphrow { flex-direction: column; } .sphleft { width: 100%; } .divider { width: auto; height: 3px; } }

.result { gap: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button.act { font: 600 1rem var(--f-body); padding: 12px 20px; border-radius: var(--r); cursor: pointer; border: 1.5px solid var(--accent); }
button.act:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.matches { display: flex; flex-direction: column; gap: 10px; }
.match { display: flex; flex-direction: column; gap: 6px; }
.katrow { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; }
.kat { flex: 1 1 260px; min-width: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 14px; padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kat .k1 { font-size: .95rem; opacity: .8; }
.kat .k2 { font: 700 1.35rem var(--f-mono); letter-spacing: .02em; user-select: all; font-variant-numeric: tabular-nums; }
.copyk { background: var(--accent); color: var(--accent-fg); flex: 0 0 auto; }
.copied { margin: 0 4px; }
.mname { margin: 0 4px; font-size: .95rem; color: var(--fg); }
.empty-msg { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--muted); }
.empty-msg.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
#reset { background: transparent; color: var(--accent); }
.status { min-height: 1.4em; margin: 0; font-size: .9rem; color: var(--ok); font-weight: 600; }
.status.warn { color: var(--warn); }
.version { margin: 0; color: var(--muted); font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .tile, button.act { transition: background .1s, border-color .1s; } }
</style>

<main>
  <header>
    <h1>Vyhledávač IOL v DOCTISu</h1>
    <p class="sub">Nejdřív vyberte typ IOL, pak dioptrie. Katalogové číslo zkopírujete tlačítkem Kopírovat a vložíte Ctrl+V.</p>
  </header>

  <section aria-labelledby="h1s">
    <div class="head"><h2 class="step" id="h1s"><b>1</b>Typ IOL</h2></div>
    <div class="tiles types" id="types"></div>
  </section>

  <section aria-labelledby="h2s" id="sphSec" hidden>
    <div class="head"><h2 class="step" id="h2s"><b>2</b>Sféra (Dsf)</h2><span class="val" id="sphVal"></span></div>

    <div class="sphrow">
      <div class="sphright">

      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="sphleft">
        <span class="lbl">Desetiny</span>
        <div class="decgrid" id="dec"></div>
      </div>
    </div>
    <p class="note" id="decNote" hidden></p>
  </section>

  <section aria-labelledby="h4s" id="cylSec" hidden>
    <div class="head"><h2 class="step" id="h4s"><b>3</b>Cylindr (Dcyl)</h2><span class="val" id="cylVal"></span></div>
    <div class="tiles wide" id="cyl"></div>
  </section>

  <p class="summary" id="summary" hidden></p>

  <section class="result" aria-labelledby="h5s" id="resSec" hidden>
    <div class="head"><h2 class="step" id="h5s">Výsledek</h2></div>
    <div class="matches" id="matches" aria-live="polite"></div>
    <div class="actions">
      <button class="act" id="reset" type="button">Nové zadání</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <p class="version">Verze 2.1.1 · 12. 11. 2026</p>
</main>

(function () {
  var abs = Math.abs;
  var DATA = JSON.parse(document.getElementById("iol-data").textContent || "{}");

  var TYPES = [
    { id: "torbi", name: "AT TORBI", full: "AT TORBI", tag: "torická", toric: true },
    { id: "lisa", name: "AT LISA", full: "AT LISA TRI", tag: "multifokální", toric: false },
    { id: "lisat", name: "AT LISA toric", full: "AT LISA TRI TORIC", tag: "multifokální torická", toric: true },
    { id: "lux", name: "LuxSmart", full: "LuxSmart", tag: "EDOF", toric: false },
    { id: "luxt", name: "LuxSmart toric", full: "LuxSmart toric", tag: "EDOF torická", toric: true }
  ];
  var CYL_VISIBLE_MAX = 5; // cylindry nad 5,0 D jsou schované pod „…“

  var st;
  function fresh() { return { type: null, neg: false, whole: null, dec: null, cyl: null, low: 0, high: false, decMore: false, cylMore: false }; }
  st = fresh();

  var $ = function (id) { return document.getElementById(id); };
  var lastCopied = "";

  function tile(label, opts) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "tile" + (opts.cls ? " " + opts.cls : "");
    if (opts.html) b.innerHTML = label; else b.textContent = label;
    if (opts.pressed !== undefined) b.setAttribute("aria-pressed", opts.pressed ? "true" : "false");
    if (opts.disabled) b.disabled = true;
    if (opts.title) b.title = opts.title;
    if (opts.aria) b.setAttribute("aria-label", opts.aria);
    b.addEventListener("click", opts.onClick);
    return b;
  }
  function more(aria, fn) { return tile("…", { cls: "more", aria: aria, title: aria, onClick: fn }); }
  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
  var cz = function (n, d) { return n.toFixed(d).replace(".", ","); };
  // cylindr: 1 desetinné místo, u hodnot jako 0,75 / 2,25 dvě
  var czc = function (c) { return cz(c, Math.abs(c * 10 - Math.round(c * 10)) < 1e-9 ? 1 : 2); };
  var eq = function (a, b) { return Math.abs(a - b) < 1e-6; };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  function type() { return TYPES.filter(function (t) { return t.id === st.type; })[0] || null; }
  function rows() { return st.type ? (DATA[st.type] || []) : []; }

  function sphere() {
    if (st.whole === null || st.dec === null) return null;
    var v = st.whole + st.dec;
    return st.neg && v !== 0 ? -v : v;
  }

  // co je pro zvolený typ v katalogu
  function avail() {
    var R = rows(), whole = {}, dec = {}, cyl = {}, hasNeg = false;
    R.forEach(function (r) {
      var s = r[0];
      if (s < 0) hasNeg = true;
      if ((s < 0) === st.neg || s === 0) {
        var w = Math.floor(abs(s) + 1e-9);
        whole[w] = true;
        dec[Math.round((abs(s) - w) * 100)] = true;
      }
      if (r[1] !== null) cyl[r[1]] = true;
    });
    var cyls = Object.keys(cyl).map(Number).sort(function (a, b) { return a - b; });
    return { whole: whole, dec: dec, cyls: cyls, hasNeg: hasNeg };
  }

  function matches() {
    var t = type(), s = sphere();
    if (!t || s === null || (t.toric && st.cyl === null)) return null;
    return rows().filter(function (r) { return eq(r[0], s) && (!t.toric || eq(r[1], st.cyl)); });
  }

  function render() {
    var t = type(), A = avail();

    // 1 typ
    var T = $("types"); T.innerHTML = "";
    TYPES.forEach(function (x) {
      T.appendChild(tile(x.name + "<small>" + x.tag + "</small>", { html: true, cls: "type", pressed: st.type === x.id,
        onClick: function () { var first = !st.type; selectType(x.id); if (first) $("sphSec").scrollIntoView({ block: "nearest", behavior: "smooth" }); } }));
    });

    // 2 sféra – znaménko
    $("sgnPlus").setAttribute("aria-pressed", st.neg ? "false" : "true");
    $("sgnMinus").setAttribute("aria-pressed", st.neg ? "true" : "false");
    $("sgnMinus").disabled = !!t && !A.hasNeg;
    $("sgnMinus").title = t && !A.hasNeg ? "Záporné dioptrie u tohoto typu v katalogu nejsou" : "";

    // celé dioptrie
    var W = $("whole"); W.innerHTML = "";
    var nums = [];
    if (st.low === 0) W.appendChild(more("Zobrazit 8–15", function () { st.low = 1; render(); }));
    if (st.low === 1) W.appendChild(more("Zobrazit 0–7", function () { st.low = 2; render(); }));
    if (st.low >= 2) nums = nums.concat(range(0, 7));
    if (st.low >= 1) nums = nums.concat(range(8, 15));
    nums = nums.concat(range(16, 30));
    var wholeTile = function (n) {
      var ok = !t || A.whole[n];
      return tile(String(n), { pressed: st.whole === n, disabled: !ok, title: ok ? "" : "Není v katalogu",
        onClick: function () { st.whole = n; changed(); } });
    };
    nums.forEach(function (n) { W.appendChild(wholeTile(n)); });
    if (!st.high) W.appendChild(more("Zobrazit 31–40", function () { st.high = true; render(); }));
    else range(31, 40).forEach(function (n) { W.appendChild(wholeTile(n)); });

    // desetiny
    var D = $("dec"); D.innerHTML = "";
    var decs = st.decMore ? [0, 0.5, 0.25, 0.75] : [0, 0.5];
    decs.forEach(function (d) {
      var ok = !t || A.dec[Math.round(d * 100)];
      D.appendChild(tile("," + String(Math.round(d * 100)).padStart(2, "0"), { pressed: st.dec === d,
        disabled: !ok, title: ok ? "" : "Není v katalogu",
        onClick: function () { st.dec = d; changed(); } }));
    });
    if (!st.decMore) D.appendChild(more("Zobrazit ,25 a ,75", function () { st.decMore = true; render(); }));

    $("sphSec").hidden = !t;
    $("resSec").hidden = !t;

    // 3 cylindr – hodnoty z katalogu zvoleného typu
    var showCyl = !!t && t.toric;
    $("cylSec").hidden = !showCyl;
    var C = $("cyl"); C.innerHTML = "";
    var low = A.cyls.filter(function (c) { return c <= CYL_VISIBLE_MAX + 1e-9; });
    var high = A.cyls.filter(function (c) { return c > CYL_VISIBLE_MAX + 1e-9; });
    var shown = st.cylMore || (st.cyl !== null && st.cyl > CYL_VISIBLE_MAX) ? low.concat(high) : low;
    shown.forEach(function (c) {
      C.appendChild(tile(czc(c), { pressed: st.cyl !== null && eq(st.cyl, c), onClick: function () { st.cyl = c; changed(); } }));
    });
    if (shown.length < A.cyls.length) C.appendChild(more("Zobrazit " + czc(high[0]) + "–" + czc(high[high.length - 1]), function () { st.cylMore = true; render(); }));

    // souhrny
    var s = sphere();
    $("sphVal").textContent = st.whole === null ? "" :
      (st.neg && s !== 0 ? "−" : "+") + st.whole + (st.dec === null ? ",__" : "," + String(Math.round(st.dec * 100)).padStart(2, "0")) + " D";
    $("cylVal").textContent = st.cyl === null ? "" : czc(st.cyl) + " D";

    // výsledek
    var M = matches(), box = $("matches"); box.innerHTML = "";
    if (M === null) {
      box.innerHTML = '<p class="empty-msg">' + (!t ? "Vyberte typ IOL." : st.whole === null ? "Vyberte celé dioptrie sféry." :
        st.dec === null ? "Vyberte desetiny sféry." : "Vyberte cylindr.") + "</p>";
    } else if (!M.length) {
      box.innerHTML = '<p class="empty-msg warn">Tato kombinace v katalogu není. Zkontrolujte dioptrie' + (t.toric ? " a cylindr." : ".") + "</p>";
    } else {
      M.forEach(function (r) {
        var d = document.createElement("div"); d.className = "match";
        d.innerHTML = '<div class="katrow"><div class="kat"><span class="k1">Katalogové číslo:</span><span class="k2">' + esc(r[2]) + "</span></div></div>" +
          '<p class="mname">' + esc(r[3]) + "</p>" + '<p class="status copied" hidden></p>';
        var b = document.createElement("button"); b.type = "button"; b.className = "act copyk"; b.textContent = "Kopírovat";
        b.addEventListener("click", function () { copy(r[2], d.querySelector(".k2"), d.querySelector(".copied")); });
        d.querySelector(".katrow").appendChild(b);
        box.appendChild(d);
      });
    }

    var sm = $("summary");
    sm.hidden = !(M && M.length);
    if (M && M.length) {
      var sTxt = (s < 0 ? "−" : "+") + cz(abs(s), 2) + " Dsf";
      sm.innerHTML = "Byla vybrána IOL typu <strong>" + t.full + "</strong> o dioptrické síle <span class=\"m\">" + sTxt +
        (t.toric ? " / +" + cz(st.cyl, 2) + " Dcyl" : "") + "</span>";
    }
    return M;
  }

  function selectType(id) {
    st.type = id;
    var A = avail();
    if (st.neg && !A.hasNeg) st.neg = false;
    if (st.cyl !== null && !A.cyls.some(function (c) { return eq(c, st.cyl); })) st.cyl = null;
    st.cylMore = false;
    changed();
  }

  function changed() {
    render();
    lastCopied = ""; setStatus("");   // kopíruje se jen kliknutím na tlačítko Kopírovat
  }

  function setStatus(text, warn) { var s = $("status"); s.textContent = text; s.classList.toggle("warn", !!warn); }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function copy(text, el, msgEl) {
    var done = function () {
      lastCopied = text; setStatus("");
      Array.prototype.forEach.call(document.querySelectorAll("#matches .copied"), function (x) { x.hidden = true; });
      if (msgEl) { msgEl.textContent = "Byl zkopírován kód: " + text; msgEl.hidden = false; } else setStatus("Byl zkopírován kód: " + text);
    };
    var fail = function () {
      if (fallbackCopy(text)) return done();
      if (el) { var r = document.createRange(); r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      setStatus("Číslo je označené – zkopírujte ho Ctrl+C.", true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }

  $("sgnPlus").addEventListener("click", function () { st.neg = false; changed(); });
  $("sgnMinus").addEventListener("click", function () {
    st.neg = true;
    if (st.low < 2) st.low = 2;               // záporné hodnoty jsou nízké – rovnou ukázat 0–15
    changed();
  });
  $("reset").addEventListener("click", function () { st = fresh(); lastCopied = ""; setStatus(""); render(); });

  render();
})();
</script>
</html>
